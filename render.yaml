# Render Blueprint — deploys the whole stack from this repo.
# Render dashboard → New → Blueprint → pick this repo. Full walkthrough:
# docs/DEPLOYMENT.md
#
# Values marked `sync: false` are secrets or URLs you type in once, in the
# dashboard, when the Blueprint is created. They are never stored in Git.

databases:
  - name: jobtrail-db
    plan: free
    databaseName: jobtrail
    user: jobtrail
    postgresMajorVersion: "17"

services:
  # FastAPI backend, built from backend/Dockerfile (TASK-020)
  - type: web
    runtime: docker
    name: jobtrail-api
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      # The frontend's public URL, e.g. https://jobtrail-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # A public demo: keep the AI bill small.
      - key: AI_RATE_LIMIT
        value: "5"
      - key: AI_DAILY_LIMIT
        value: "100"

  # React frontend as a static site: Render's CDN serves dist/, so no
  # nginx container is needed here (the Dockerfile is for compose/other hosts).
  - type: web
    runtime: static
    name: jobtrail-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # The backend's public URL, e.g. https://jobtrail-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
